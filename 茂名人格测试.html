    { title:'河东市场突然有新鲜又便宜的海鲜，但你已经买好菜了，你会？', options:[
      { text:'果断买！多出来的菜明天吃，海鲜今天吃', dims:[1,2, 3,-2] },
      { text:'犹豫三秒，算了一下预算，然后买了', dims:[1,1, 3,1] },
      { text:'忍痛放弃，计划外的事情不做，下次再说', dims:[1,-1, 3,2] },
      { text:'无所谓，已经买好了今晚就这样吧', dims:[1,-2, 3,1] }
    ]}
  ],
  // ── 压力 + 驱动 ──
  [
    { title:'月底发现这个月花超了，你的应对是？', options:[
      { text:'立刻打开记账本，分析钱花哪了，下月调整', dims:[2,2, 3,2] },
      { text:'大概知道怎么回事，下个月省一点就行', dims:[2,1, 3,1] },
      { text:'跟朋友吐槽"物价好贵"，然后默默减少不必要的开销', dims:[2,-1, 3,-1] },
      { text:'管它呢，反正下个月还有工资，开心最重要', dims:[2,-2, 3,-2] }
    ]},
    { title:'老板/老师发来"有空吗聊一下"但不说什么事，你的反应是？', options:[
      { text:'直接回"好"，然后快速复盘最近做了什么，准备应对', dims:[2,2, 3,2] },
      { text:'回了"好的"但心里默默把最近所有可能出问题的事过了一遍', dims:[2,1, 3,1] },
      { text:'跟旁边同事吐槽"你说他找我什么事"，然后才回消息', dims:[2,-1, 3,-1] },
      { text:'装没看到先拖半小时，等自己想清楚再回', dims:[2,-2, 3,-2] }
    ]}
  ]
];

// Q9 职业画像 + Q10 偏好微调 (固定)
var FIXED_Q=[
  { title:'周四下午两点，你大概率在干嘛？', options:[
    { text:'坐办公室对电脑，屏幕都不敢切出去', dims:[] },
    { text:'在外面跑，见人 / 送货 / 巡店 / 跑业务', dims:[] },
    { text:'在车间 / 工地 / 操作间，手上沾着东西', dims:[] },
    { text:'在教室 / 图书馆 / 宿舍', dims:[] },
    { text:'说不准，每天不一样，主打一个自由', dims:[] },
    { text:'在家，别问，问就是在探索人生', dims:[] }
  ]},
  { title:'茂名突然多了一天带薪假期，你会用它来做什么？', options:[
    { text:'组织朋友聚餐/唱K/一滩烧烤，一起嗨', dims:[0,1] },
    { text:'一个人去没去过的地方探店/拍照/闲逛', dims:[3,-1] },
    { text:'把平时没时间处理的杂事全部清掉', dims:[2,1] },
    { text:'在家睡到自然醒，点外卖看剧，不出门', dims:[1,-1] },
    { text:'研究一下副业或者搞钱的路子，不浪费', dims:[3,1] },
    { text:'看心情，计划永远赶不上变化', dims:[1,1] }
  ]}
];

var QUESTIONS=[];

var dimScores=[0,0,0,0];
var currentQ=0;
var careerAnswer='';

function start(){
  dimScores=[0,0,0,0]; currentQ=0; careerAnswer='';
  // 从每个维度对随机抽 1 题
  QUESTIONS=[];
  for(var p=0;p<QUESTION_POOL.length;p++){
    QUESTIONS.push(QUESTION_POOL[p][Math.floor(Math.random()*QUESTION_POOL[p].length)]);
  }
  // 追加固定题
  for(var f=0;f<FIXED_Q.length;f++){ QUESTIONS.push(FIXED_Q[f]); }

  document.getElementById('homeSection').classList.add('hidden');
  document.getElementById('quizSection').classList.remove('hidden');
  document.getElementById('resultSection').style.display='none';
  window.scrollTo({top:0,behavior:'smooth'});
  showQuestion();
}

function showQuestion(){
  var q=QUESTIONS[currentQ];
  var pct=Math.round((currentQ/QUESTIONS.length)*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=(currentQ+1)+'/'+QUESTIONS.length;
  var h='<div class="q-title">'+q.title+'</div>';
  for(var i=0;i<q.options.length;i++){
    h+='<button class="option" onclick="pick('+i+',this)">'+q.options[i].text+'</button>';
  }
  document.getElementById('questionCard').innerHTML=h;
}

function pick(optIndex,btn){
  var opts=document.querySelectorAll('.option');
  for(var i=0;i<opts.length;i++)opts[i].classList.remove('selected');
  btn.classList.add('selected');
  setTimeout(function(){
    var q=QUESTIONS[currentQ];
    var chosen=q.options[optIndex];
    if(currentQ===8){ careerAnswer=chosen.text; }
    else if(chosen.dims&&chosen.dims.length>0){
      for(var d=0;d<chosen.dims.length;d+=2){
        dimScores[chosen.dims[d]]+=chosen.dims[d+1];
      }
    }
    currentQ++;
    if(currentQ<QUESTIONS.length){ showQuestion(); }
    else{ showResult(); }
  },200);
}

function showResult(){
  document.getElementById('quizSection').classList.add('hidden');

  // 原始分平滑: dimScores/2，保留一位小数，不做整数截断
  var raw=[];
  for(var d=0;d<4;d++)raw[d]=Math.max(-4,Math.min(4,parseFloat((dimScores[d]/2).toFixed(1))));

  // 向量匹配: 用 raw 值而非整数 round，减少半分之差导致的翻转
  var scores=[];
  for(var t=0;t<TYPES.length;t++){
    scores[t]=raw[0]*TYPES[t].vec[0]+raw[1]*TYPES[t].vec[1]+raw[2]*TYPES[t].vec[2]+raw[3]*TYPES[t].vec[3];
  }
  // 找第一和第二
  var bestI=0,bestScore=-99,secondI=0,secondScore=-99;
  for(var t=0;t<scores.length;t++){
    if(scores[t]>bestScore){ secondScore=bestScore; secondI=bestI; bestScore=scores[t]; bestI=t; }
    else if(scores[t]>secondScore){ secondScore=scores[t]; secondI=t; }
  }
  var type=TYPES[bestI];
  var gap=bestScore-secondScore;
  var showRunner=(gap<=2.5); // 差距 ≤2.5 显示次类型

  // 职业标签
  var careerTag='';
  if(careerAnswer){
    if(careerAnswer.includes('办公室')||careerAnswer.includes('电脑'))careerTag='办公室战士';
    else if(careerAnswer.includes('跑')||careerAnswer.includes('送货')||careerAnswer.includes('见人'))careerTag='奔波型选手';
    else if(careerAnswer.includes('车间')||careerAnswer.includes('工地')||careerAnswer.includes('操作间'))careerTag='实干派';
    else if(careerAnswer.includes('教室')||careerAnswer.includes('图书馆')||careerAnswer.includes('宿舍'))careerTag='校园党';
    else if(careerAnswer.includes('自由')||careerAnswer.includes('说不准'))careerTag='自由身';
    else careerTag='探索中';
  }

  // 维度条 + 置信度标记
  var dimHTML='';
  var wobble=[];
  for(var d=0;d<4;d++){
    var pct=50+(raw[d]/8)*100;
    var absV=Math.abs(raw[d]);
    var side=raw[d]>=0?DIMS[d].right:DIMS[d].left;
    var confidence='';
    if(absV<=0.8)confidence=' ⚡摇摆';
    else if(absV<=1.5)confidence=' ~偏'+side.split(' ')[0];
    wobble[d]=absV<=1;
    dimHTML+='<div class="dim-row">'+
      '<span class="dim-label-l">'+DIMS[d].left+'</span>'+
      '<div class="dim-track"><div class="dim-fill" style="width:'+pct+'%"></div></div>'+
      '<span class="dim-label-r">'+DIMS[d].right+'</span>'+
      '</div>'+
      '<div class="dim-row" style="margin-bottom:8px;color:#999;font-size:10px;">'+
      '<span style="min-width:50px;"></span>'+
      '<span style="flex:1;text-align:center;">'+side+confidence+'</span>'+
      '<span style="min-width:50px;"></span>'+
      '</div>';
  }

  // 摇摆提醒
  var wobbleCount=wobble.filter(function(x){return x;}).length;
  var wobbleNote='';
  if(wobbleCount>=2){
    wobbleNote='<div style="background:#fffbf0;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:11px;color:#b88020;text-align:center;">'+
      '⚡ 你有 '+wobbleCount+' 个维度接近中间线，重测可能偏到相邻类型哦</div>';
  }

  // 次类型标记
  var runnerHTML='';
  if(showRunner){
    var rtype=TYPES[secondI];
    runnerHTML='<div style="background:#f9f9f9;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:12px;color:#888;text-align:center;">'+
      '也可能像 <b style="color:#555;">'+rtype.label+'</b>（'+rtype.code+'）'+
      '</div>';
  }

  var html=
    '<div class="result-card">'+
      '<div class="result-icon">'+type.icon+'</div>'+
      '<div class="result-label">'+type.label+'</div>'+
      '<div class="result-code">茂名人格代码：'+type.code+'</div>'+
      '<div class="result-punch">'+type.punch+'</div>'+
      '<div class="result-desc">'+type.desc+'</div>'+
      '<div class="dim-section">'+dimHTML+'</div>'+
      wobbleNote+runnerHTML+
      '<div class="result-motto">"'+type.motto+'"</div>'+
      '<div class="result-tags">'+
        type.tags.map(function(t){return'<span class="tag">'+t+'</span>';}).join('')+
        (careerTag?'<span class="tag">'+careerTag+'</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="share-hint">'+
      '<p>📸 分享你的茂名人格结果</p>'+
      '<div class="share-actions">'+
        '<button class="share-act-btn primary" onclick="shareCopy()">📋 复制我的人格结果</button>'+
        '<button class="share-act-btn secondary" onclick="shareSend()">💬 发给朋友测一下</button>'+
        '<button class="share-act-btn hint" onclick="shareScreenshot()">📸 截图发朋友圈</button>'+
      '</div>'+
    '</div>'+
    '<button class="retake-btn" onclick="start()">再测一次</button>';

  document.getElementById('resultSection').innerHTML=html;
  document.getElementById('resultSection').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});

  window._resultType=type;
  window._resultCode=type.code;
}

function isWechat(){
  return /MicroMessenger/i.test(navigator.userAgent||'');
}

function getShareText(){
  var type=window._resultType;
  if(!type)return '';
  return '我测出来是「'+type.label+'」｜茂名人格代码 '+type.code+'。\n"'+type.punch+'"\n你也测测你是什么茂名人格：';
}

function showShareToast(msg){
  var t=document.getElementById('shareToast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2000);
}

function shareCopy(){
  var text=getShareText();
  if(!text)return;
  var full=text+'\n'+location.href;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(full).then(function(){
      showShareToast('已复制结果，去发给朋友吧！');
    }).catch(function(){
      fallbackCopyText(full);
    });
  }else{
    fallbackCopyText(full);
  }
}

function fallbackCopyText(text){
  var ta=document.createElement('textarea');
  ta.value=text;ta.style.position='fixed';ta.style.opacity='0';
  document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');showShareToast('已复制结果，去发给朋友吧！');}
  catch(e){showShareToast('复制失败，请截图分享吧');}
  document.body.removeChild(ta);
}

function shareSend(){
  var text=getShareText();
  if(!text)return;
  if(isWechat()){
    showShareToast('点右上角 ··· 转发给朋友 / 朋友圈');
    return;
  }
  if(navigator.share){
    navigator.share({title:'茂名人格图鉴',text:text,url:location.href}).catch(function(){});
  }else{
    shareCopy();
  }
}

function shareScreenshot(){
  if(isWechat()){
    showShareToast('点右上角 ··· 转发给朋友 / 朋友圈');
    return;
  }
  showShareToast('截好图后，去朋友圈发吧！');
}

(function(){
  var base=3000+Math.floor(Math.random()*500);
  var el=document.getElementById('fakeCount');
  if(el)el.textContent=base.toLocaleString();
  var ogUrl=document.getElementById('ogUrl');
  if(ogUrl)ogUrl.setAttribute('content',location.href);
})();
</script>
